{% extends "base.html" %}
{% block title %}Lier un appareil{% endblock %}
{% block content %}
<div class="card narrow">
<h1>Lier cet appareil ?</h1>
<p class="muted" style="margin:0 0 4px">Cet appareil demande à être lié à ton compte.</p>
<p style="margin:12px 0 0"><b>{{ agent.hostname }}</b><br><span class="muted">{{ agent.os }} · {{ agent.interface }} · {{ agent.kind }}</span></p>
<form method="post">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<button class="full">Lier à mon compte</button>
</form>
</div>
{% endblock %}
