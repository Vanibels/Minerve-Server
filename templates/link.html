{% extends "base.html" %}
{% block title %}Lier un appareil{% endblock %}
{% block content %}
<div class="card narrow">
<h1>Lier cet appareil ?</h1>
<p><b>{{ agent.hostname }}</b> ({{ agent.os }}, {{ agent.interface }}, {{ agent.kind }}) demande à être lié à ton compte.</p>
<form method="post">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<button>Lier à mon compte</button>
</form>
</div>
{% endblock %}
