{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="card narrow">
<h1>Connexion</h1>
<p class="muted" style="margin:0">{% if claim %}Après connexion, l'appareil qui vient de se connecter sera lié à ton compte.{% else %}Content de te revoir.{% endif %}</p>
<form method="post">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label for="email">E-mail</label>
<input id="email" type="email" name="email" required autocomplete="email">
<label for="password">Mot de passe</label>
<input id="password" type="password" name="password" required autocomplete="current-password">
<button class="full">Se connecter</button>
</form>
<p class="muted" style="margin:18px 0 0">Pas de compte ? <a href="{{ url_for('register') }}">En créer un</a></p>
</div>
{% endblock %}
