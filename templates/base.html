<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="../static/Minerve.png" type="image/x-icon">
<title>{% block title %} | Minerve{% endblock %}</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#14202e;--muted:#5b6b7d;--line:#dde3ea;--accent:#2f6fed;--ok:#1a7f4b;--bad:#c0392b;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1722;--card:#16212e;--text:#e8eef5;--muted:#9fb0c3;--line:#2a3a4c;--accent:#6aa0ff;--ok:#4cc38a;--bad:#ff7a6b;--warn:#f0b35a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
header form{display:inline;margin:0}
.brand{font-weight:700;color:var(--text);text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:24px}
h1{font-size:26px;margin:0 0 16px}
h2{font-size:19px;margin:28px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.big{font-size:30px;font-weight:700}
.muted{color:var(--muted);font-size:14px}
.flash{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.flash.ok{border-color:var(--ok)}.flash.error{border-color:var(--bad)}
label{display:block;margin:12px 0 4px;font-weight:600}
input[type=email],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px}
button{margin-top:16px;padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
button.link{margin:0;padding:0;background:none;color:var(--accent);text-decoration:underline}
.narrow{max-width:420px;margin:40px auto}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
.pill{padding:2px 10px;border-radius:999px;border:1px solid currentColor;font-size:13px}
.s-en{color:var(--ok)}.s-ho{color:var(--bad)}.s-in{color:var(--muted)}
.sc-op{color:var(--bad)}.sc-fo{color:var(--warn)}.sc-ap{color:var(--muted)}
</style>
</head>
<body>
<header>
<a class="brand" href="/"><img src="../static/Minerve-full.png"></a>
{% if g.user %}
<span class="muted">{{ g.user.email }}</span>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link">Déconnexion</button></form>
{% endif %}
</header>
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<p class="flash {{ cat }}">{{ msg }}</p>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
